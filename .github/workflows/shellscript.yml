name: 'cicd'

on:
 push:
   branches:
     - main
     - master

env:
  setup: "prod"

jobs:
  run-shell-script:
    name: 'shell script'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: add executable permssions
        run: chmod +x script.sh
      - name: run file
        run: ./script.sh

  install:
     name: 'install packages'
     runs-on: ubuntu-latest
     needs: run-shell-script
     steps:
        - name: install terraform
          uses: hashicorp/setup-terraform@v3
          with:
            version: 1.5.6
        - name: terraform version
          run: terraform --version
        - name: python
          uses: actions/setup-python@v5
          with:
            version: 3.11
        - name: python version
          run: python --version
        - name: install docker
          uses: docker/setup-buildx-action@v3
        - name: docker version
          run: docker --version
