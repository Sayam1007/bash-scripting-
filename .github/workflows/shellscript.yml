name: 'shell script cicd'

on:
 push:
   branches:
     - main
     - master

env:
  project: 'shell script'

jobs:
  run-shell-script:
   name: 'shell script run'
   runs-on: ubuntu-latest
   steps:
      - name: checkout
        uses: actions/checkout@v2
